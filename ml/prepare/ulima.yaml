# Датасет Universidad de Lima: 1046 кадров 3840×2160 с четырёх камер одной стройки, рамки YOLO.
# Источник: https://doi.org/10.26439/ulima.datasets.13359 (CC BY 4.0), статья — Data in Brief,
# 2022, https://pmc.ncbi.nlm.nih.gov/articles/PMC8933580/. Разбор — ml/README.md, «Датасет Лимы».

# Порядок номеров классов в .txt датасета. Коды системы — через aliases «ulima:<метка>»
# в packages/contracts/equipment_classes.yaml.
labels: [Dump_truck, Excavator, Concrete_mixer_truck, Skid_steer, Tower_crane, Truck_crane, Truck, Person]

# Рамки, которые не берём: ошибки разметки, найденные при просмотре вырезок.
exclude_boxes:
  - {image: 726, label: Truck_crane}  # на кадре башенный кран, а не бетононасос

# Серии съёмки: камера — по подписи на кадре, время — таблица 3 статьи, сверенная со штампом
# на кадрах (у 208–258 в таблице 01:09 вместо 13:09, 323–332 в таблице нет).
# split — по сериям, а не по кадрам: соседние кадры серии почти одинаковы, и кадр в обучении
# с соседом в тесте завысил бы метрики. В тесте каждая камера и все классы, кроме экскаватора
# (3 рамки на весь датасет); миксер в тесте — только 6 кадров серии 1044–1049: остальные
# миксеры и стрела насоса на Torre H есть лишь в двух сериях, и без них не из чего учиться.
bursts:
  - {ids: [1, 1],       camera: cam-d1,      start: "2020-12-02 09:10:15", end: "2020-12-02 09:10:15", split: train}
  - {ids: [2, 54],      camera: cam-i1,      start: "2021-01-06 10:59:00", end: "2021-01-06 11:05:54", split: test}
  - {ids: [55, 106],    camera: cam-torre-h, start: "2020-12-02 09:09:00", end: "2020-12-02 09:15:00", split: val}
