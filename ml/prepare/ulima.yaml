  - {ids: [158, 207],   camera: cam-torre-h, start: "2021-02-12 08:59:07", end: "2021-02-12 09:05:00", split: train}
  - {ids: [208, 258],   camera: cam-torre-h, start: "2020-11-20 13:09:57", end: "2020-11-20 13:15:00", split: test}
