<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>СтройКонтроль — API</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
  <style>body{margin:0}</style>
</head>
<body>
  <div id="swagger"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
  <script>
    // Сводная страница: один выпадающий список со спецификациями всех сервисов.
    // Сервисы, которых ещё нет, просто не загрузятся — страница от этого не ломается.
    window.onload = function () {
      SwaggerUIBundle({
        dom_id: "#swagger",
        deepLinking: true,
        urls: [
          { name: "plan-service",     url: "/api/v1/plan/openapi.json" },
          { name: "site-service",     url: "/api/v1/site/openapi.json" },
          { name: "analysis-service", url: "/api/v1/analysis/openapi.json" },
          { name: "vision-service",   url: "/api/v1/vision/openapi.json" }
        ]
      });
    };
  </script>
</body>
</html>
