# Единая точка входа. Бизнес-логики здесь нет и быть не должно.
#
# Путь НЕ переписывается: префикс сервиса одинаков снаружи и внутри (ADR-0009).
# Апстримы заданы переменными и резолвятся в рантайме через DNS Docker —
# поэтому gateway поднимается даже когда часть сервисов ещё не написана
# и отдаёт по ним честные 502, а не падает при старте.

server {
    listen 80;
    server_name _;

    client_max_body_size 256m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Идентификатор запроса: принимаем свой, иначе выдаём новый.
    # По нему собирается вся цепочка вызовов через все сервисы.
    set $req_id $http_x_request_id;
    if ($req_id = "") { set $req_id $request_id; }

    proxy_set_header X-Request-Id $req_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    add_header X-Request-Id $req_id always;

    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"gateway"}';
    }

    location /api/v1/plan/ {
        set $up http://plan-service:8000;
        proxy_pass $up$request_uri;
    }

    location /api/v1/site/ {
        set $up http://site-service:8000;
        proxy_pass $up$request_uri;
        proxy_read_timeout 300s;   # пакетная загрузка снимков
    }

    location /api/v1/analysis/ {
        set $up http://analysis-service:8000;
        proxy_pass $up$request_uri;
    }

    location /api/v1/vision/ {
        set $up http://vision-service:8000;
        proxy_pass $up$request_uri;
        proxy_read_timeout 300s;
    }

    # Неизвестный префикс API — честный 404 в едином конверте ошибки, а не index.html
    # из location / : клиент API должен видеть, что такого сервиса нет.
    location /api/ {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"Нет такого сервиса API","details":{},"request_id":"$req_id"}}';
    }

    # Сводный Swagger по всем сервисам
    location = /docs {
        root /usr/share/nginx/swagger;
        try_files /index.html =404;
    }

    # Интерфейс: статика SPA, все неизвестные пути отдаются роутеру
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
