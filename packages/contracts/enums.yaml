# Канонические перечисления системы. Единственный источник истины.
#
# Правила (packages/contracts/README.md):
#   - добавить значение можно;
#   - удалить или переименовать — несовместимое изменение, нужен ADR и /api/v2;
#   - дублировать эти списки в коде сервисов запрещено. Единственное исключение —
#     CHECK-ограничения в миграциях и моделях БД (AGENTS.md, раздел 7).
#
# Значения SCREAMING_SNAKE_CASE. Классы техники — не перечисление, а справочник:
# они лежат в equipment_classes.yaml (ADR-0014).

object_type:        [RESIDENTIAL_MONOLITH, RESIDENTIAL_PANEL, PUBLIC_BUILDING, ROAD]
construction_phase: [PREPARATORY, SUBSTRUCTURE, SUPERSTRUCTURE, ENVELOPE_ROOF, NETWORKS, LANDSCAPING]
object_lifecycle:   [DRAFT, ACTIVE, ARCHIVED]

zone_type:          [PIT, BUILDING_FOOTPRINT, PERIMETER, ENTRY_GATE, STORAGE, DANGER, ROAD]
# Роль типа зоны определяет, что значит машина на участке этого типа
# (docs/methodology.md, раздел 6):
#   WORK    — здесь идут работы этапов; машина в активном рабочем участке работает;
#   SERVICE — здесь машины ждут; нетранзитная машина здесь простаивает;
#   SAFETY  — опасная зона, накладывается поверх остальных и даёт D6.
zone_type_role:
  PIT: WORK
  BUILDING_FOOTPRINT: WORK
  PERIMETER: WORK
  ROAD: WORK
  ENTRY_GATE: SERVICE
  STORAGE: SERVICE
  DANGER: SAFETY
# Русское название типа зоны. Это название участка по умолчанию, если при разметке его не
# задали (docs/data-model.md, 2.2), и подпись типа в интерфейсе.
zone_type_name:
  PIT: Котлован
  BUILDING_FOOTPRINT: Пятно застройки
  PERIMETER: Периметр
  ENTRY_GATE: Въезд
  STORAGE: Склад
  DANGER: Опасная зона
  ROAD: Дорога
visibility_status:  [OK, PARTIAL, BLIND]
visibility_reason:  [NO_IMAGES, DARK, BLURRED, OCCLUDED]

equipment_group:    [EARTHWORKS, LIFTING, CONCRETE, TRANSPORT, ROAD, OTHER]
equipment_state:    [WORKING, IDLE, OUT_OF_ZONE, UNKNOWN]

# Порядок значений — порядок стадий на фото: «раньше» и «позже» в D7 и в ограничении
# прогресса сравниваются по индексу в этом списке.
stage_label:        [PIT, PILES, FOUNDATION, FRAME, FACADE, LANDSCAPING]
stage_source:       [GENERATED, IMPORT, MANUAL]
stage_fact_status:  [NOT_STARTED, IN_PROGRESS, DONE, LATE, AHEAD]
dependency_type:    [FS, SS, FF, SF]

image_status:       [NEEDS_TIME, PENDING, PROCESSING, ANALYZED, FAILED]
image_source:       [UPLOAD, API, FOLDER_IMPORT]
timestamp_source:   [EXIF, FILENAME, MANUAL, UNKNOWN]

deviation_code:     [D1, D2, D3, D4, D5, D6, D7, D8, D9, D10]
severity:           [INFO, LOW, MEDIUM, HIGH]
deviation_status:   [NEW, CONFIRMED, REJECTED, RESOLVED]

object_status:      [ON_TRACK, DELAY, AHEAD, UNKNOWN]
confidence:         [LOW, MEDIUM, HIGH]
analysis_trigger:   [FACTS_UPDATED, PLAN_CHANGED, MANUAL]
run_status:         [RUNNING, DONE, FAILED]
