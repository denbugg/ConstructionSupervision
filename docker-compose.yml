# Полный стек системы. Запуск: make up
# Сервисы, которых ещё нет в services/, добавляются сюда по мере готовности —
# gateway резолвит апстримы в рантайме и не падает из-за отсутствующего контейнера.

name: lct

x-service-base: &service-base
  restart: unless-stopped
  env_file: [.env]
  networks: [lct]

x-python-env: &python-env
  ENV: ${ENV}
  LOG_LEVEL: ${LOG_LEVEL}
  API_KEY: ${API_KEY}
  TZ: ${TZ}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS}
  CONTRACTS_DIR: ${CONTRACTS_DIR:-/contracts}

# Справочные файлы (классы техники, перечисления) — данные только для чтения,
# а не канал обмена между сервисами (architecture.md, раздел 6).
x-contracts-volume: &contracts-volume ./packages/contracts:/contracts:ro

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLAN_DB_PASSWORD: ${PLAN_DB_PASSWORD}
      SITE_DB_PASSWORD: ${SITE_DB_PASSWORD}
      ANALYSIS_DB_PASSWORD: ${ANALYSIS_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lct]

  # S3-хранилище снимков и отчётов (ADR-0016): SeaweedFS, всё в одном контейнере. Digest рядом
  # с тегом — на любой машине скачаются те же байты, даже если тег перевыпустят.
  s3:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    # WebDAV, Iceberg и Lance стеку не нужны: не открываем лишние порты.
    command: >-
      mini -dir=/data -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
      -admin.user=${S3_ACCESS_KEY} -admin.password=${S3_SECRET_KEY}
    environment:
      # С ключами SeaweedFS проверяет подпись каждого запроса; без них пускал бы всех.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - s3data:/data
    # 8333 — S3 для отладки с хоста (браузер ходит в хранилище через gateway, ADR-0017),
    # 23646 — веб-интерфейс администратора.
    ports: ["8333:8333", "23646:23646"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lct]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [lct]

  plan-service:
    <<: *service-base
    # Имя образа задано вместе с build: собранный локально образ получает то же
    # имя, что опубликованный, поэтому docker compose pull и up взаимозаменяемы.
    image: ${IMAGE_REGISTRY:-lct}/plan-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/plan-service/Dockerfile
    environment:
      <<: *python-env
      PLAN_DB_DSN: ${PLAN_DB_DSN}
    volumes: [*contracts-volume]
    ports: ["8001:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  site-service:
    <<: *service-base
    image: ${IMAGE_REGISTRY:-lct}/site-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/site-service/Dockerfile
    environment:
      <<: *python-env
      SITE_DB_DSN: ${SITE_DB_DSN}
      IMPORT_DIR: /import
    volumes:
      - *contracts-volume
      # Демо-хронология для POST /images/import: подпапка = код камеры (data/README.md).
      - ./data/seed/images:/import:ro
    ports: ["8002:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Воркер распознавания: тот же образ, другой процесс (services/site-service/README.md, раздел 2).
  # Реплик может быть сколько угодно: снимок забирается в работу одним UPDATE.
  site-worker:
    <<: *service-base
    image: ${IMAGE_REGISTRY:-lct}/site-service:${IMAGE_TAG:-latest}
    command: ["arq", "src.worker.WorkerSettings"]
    environment:
      <<: *python-env
      SITE_DB_DSN: ${SITE_DB_DSN}
      # Схему ведёт site-service, воркер ждёт его готовности: две реплики не мигрируют разом.
      RUN_MIGRATIONS: "false"
    volumes: [*contracts-volume]
    depends_on:
      site-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # arq сам пишет отметку живости в Redis; --check читает её.
      test: ["CMD", "arq", "--check", "src.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  analysis-service:
    <<: *service-base
    image: ${IMAGE_REGISTRY:-lct}/analysis-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/analysis-service/Dockerfile
    environment:
      <<: *python-env
      ANALYSIS_DB_DSN: ${ANALYSIS_DB_DSN}
    volumes: [*contracts-volume]
    ports: ["8003:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      # Бакет `reports` для PDF-отчётов (README analysis-service, раздел 5).
      s3:
        condition: service_healthy
    # Локальная LLM на хосте (llama-server, runbook §4): Docker Desktop знает это имя сам,
    # на Linux его даёт host-gateway.
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  vision-service:
    <<: *service-base
    image: ${IMAGE_REGISTRY:-lct}/vision-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/vision-service/Dockerfile
      args:
        TORCH_INDEX_URL: ${VISION_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    environment:
      <<: *python-env
      VISION_DEVICE: ${VISION_DEVICE:-cuda}
    volumes:
      - *contracts-volume
      # Веса моделей (python scripts/fetch_models.py), в том числе текстовый энкодер CLIP для
      # промптов YOLO-World в /models/clip: образ указывает Ultralytics этот каталог.
      - ./data/models:/models:ro
    ports: ["8004:8000"]
    # Видеокарту пробрасывает оверлей docker-compose.gpu.yml: без карты на машине запрос
    # устройства в этом файле не дал бы стеку подняться вовсе.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Веса грузятся в память и прогреваются: на CPU это до минуты.
      start_period: 90s

  # Резюме PDF-отчётов локальной моделью (ADR-0008): llama.cpp с Gemma 4 E4B — как на демо-стенде.
  # Профиль llm включён в .env.example (COMPOSE_PROFILES), модель качает fetch_models.py.
  # Своя модель или облачный API — LLM_* в .env, профиль тогда не нужен (README, раздел 3).
  # Без видеокарты тот же образ считает на процессоре, только медленнее.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11096@sha256:0192ab2545efcbe79c240645e34abd8fffbe4813aedcef5a0e3a886ef6d6d82f
    profiles: [llm]
    restart: unless-stopped
    # Режим рассуждений выключен: для пересказа готовых фактов он только тратит время.
    command:
      - -m
      - /models/gemma-4-E4B-it-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "8192"
      - -ngl
      - "99"
      - --alias
      - gemma-4-e4b
      # Читать файл целиком, а не через mmap: на Docker Desktop под Windows mmap файла с диска
      # хоста идёт страницами через файловый мост, и 5 ГБ грузятся дольше трёх минут, а так — 40 с.
      - --load-mode
      - none
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
    volumes:
      - ./data/models/llm:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [lct]

  # Скрипты проекта (fetch_models, seed, e2e) без Python на хосте — нужен только Docker:
  #   docker compose run --rm tools python scripts/seed.py
  # Профиль не даёт ему подниматься с остальными; run запускает его и так.
  tools:
    build:
      context: ./scripts
    profiles: [tools]
    environment:
      GATEWAY_URL: http://gateway
    volumes:
      - .:/repo
    networks: [lct]

  gateway:
    <<: *service-base
    image: ${IMAGE_REGISTRY:-lct}/gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports: ["${GATEWAY_PORT:-8080}:80"]
    healthcheck:
      # 127.0.0.1, а не localhost: в alpine localhost резолвится в ::1, а nginx слушает только IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
  s3data:

networks:
  lct:
    driver: bridge
